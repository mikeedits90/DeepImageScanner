name: Build DeepImageScanner APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          rm -rf extracted
          mkdir extracted
          unzip -o DeepImageScanner-project.zip -d extracted
          cp -a extracted/. .

      - name: Fix Java and Kotlin JVM targets
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("app/build.gradle.kts")
          text = p.read_text()

          # Force Java compilation to Java 17.
          if "compileOptions {" not in text:
              marker = "android {"
              replacement = """android {
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          """
              text = text.replace(marker, replacement, 1)
          else:
              text = text.replace(
                  "JavaVersion.VERSION_1_8",
                  "JavaVersion.VERSION_17"
              )

          # Force Kotlin to target JVM 17.
          if "kotlinOptions {" not in text:
              marker = "android {"
              replacement = """android {
              kotlinOptions {
                  jvmTarget = "17"
              }
          """
              text = text.replace(marker, replacement, 1)

          p.write_text(text)

          print("----- app/build.gradle.kts -----")
          print(text)
          PY

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DeepImageScanner-APK
          path: app/build/outputs/apk/debug/app-debug.apk
